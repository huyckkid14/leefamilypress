<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#070b10">
<title>Aerial Drive Simulator</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="">
<style>
:root{--panel:rgba(7,11,16,.88);--line:rgba(255,255,255,.14);--text:#f7f9fb;--muted:#a9b3bf;--green:#4df578;--red:#ff7676}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#091015;color:var(--text);font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button,input{font:inherit}button{border:0;color:inherit;cursor:pointer}#app{height:100vh;display:grid;grid-template-rows:64px minmax(0,1fr)}
header{z-index:1200;display:flex;align-items:center;gap:18px;padding:0 16px;background:#080c11;border-bottom:1px solid var(--line)}.brand{display:flex;align-items:center;gap:10px;font-weight:900}.logo{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;background:#f5f7fa;color:#0d1217;font-weight:1000}.title{white-space:nowrap}.tag{font-size:11px;color:#8d99a6;font-weight:700;letter-spacing:.08em;text-transform:uppercase}.search{margin-left:auto;width:min(420px,42vw);height:40px;display:flex;border:1px solid var(--line);border-radius:12px;background:rgba(255,255,255,.07);overflow:hidden}.search input{flex:1;min-width:0;background:transparent;border:0;outline:0;color:#fff;padding:0 13px}.search input::placeholder{color:#7e8995}.search button,.reset{background:rgba(255,255,255,.06)}.search button{width:44px}.reset{width:42px;height:40px;border:1px solid var(--line);border-radius:12px;font-size:20px}
main{position:relative;min-height:0;overflow:hidden}#map{position:absolute;inset:0;background:#172019}.glass{background:var(--panel);border:1px solid var(--line);box-shadow:0 15px 45px rgba(0,0,0,.35);backdrop-filter:blur(11px);-webkit-backdrop-filter:blur(11px)}
.mode{position:absolute;z-index:700;left:16px;top:16px;display:flex;gap:5px;padding:5px;border-radius:14px}.mode button,.vehicle button{min-height:39px;padding:0 15px;border-radius:10px;background:rgba(255,255,255,.06);font-weight:800}.mode button.active,.vehicle button.active{background:#f4f7fa;color:#11161b}.vehicle{position:absolute;z-index:700;left:16px;top:77px;width:126px;display:grid;gap:6px;padding:8px;border-radius:14px}.small-title{font-size:9px;color:#84909c;letter-spacing:.15em;font-weight:900;padding:3px 7px;text-transform:uppercase}
.status{position:absolute;z-index:700;left:16px;top:224px;min-width:200px;padding:11px 13px;border-radius:14px}.row{display:flex;justify-content:space-between;gap:18px;margin:6px 0}.row span{font-size:9px;letter-spacing:.12em;font-weight:900;color:#87939f}.row strong{font-size:12px;font-variant-numeric:tabular-nums}.follow{position:absolute;z-index:700;right:16px;top:16px;padding:7px;border-radius:14px}.follow button{height:40px;padding:0 15px;border-radius:10px;background:rgba(255,255,255,.06);font-weight:800}.follow button.active{background:#f4f7fa;color:#11161b}
.speed{position:absolute;z-index:700;left:50%;bottom:22px;transform:translateX(-50%);min-width:220px;padding:11px 15px 13px;border-radius:16px;display:grid;grid-template-columns:auto auto;align-items:end;gap:0 10px}.speednum{font-size:47px;line-height:.9;font-weight:950;letter-spacing:-.06em;text-align:right;font-variant-numeric:tabular-nums}.speedmeta{display:grid;gap:3px;padding-bottom:3px}.speedmeta span{font-size:10px;color:#87939f;font-weight:800}.speedmeta strong{font-size:12px;color:var(--green)}.bar{grid-column:1/-1;height:4px;background:rgba(255,255,255,.12);border-radius:999px;overflow:hidden;margin-top:10px}.bar i{display:block;width:0;height:100%;background:var(--green)}
.wheelwrap{position:absolute;z-index:700;right:28px;bottom:25px;width:190px;height:190px;pointer-events:none;filter:drop-shadow(0 16px 25px rgba(0,0,0,.45))}.wheel{position:relative;width:100%;height:100%;transition:transform .05s linear}.rim{position:absolute;inset:0;border:16px solid rgba(5,8,10,.93);border-radius:50%;box-shadow:inset 0 0 0 3px rgba(255,255,255,.08)}.spoke{position:absolute;left:50%;top:50%;width:72px;height:20px;transform-origin:0 50%;border-radius:8px;background:#192027}.a{transform:translate(0,-50%) rotate(30deg)}.b{transform:translate(0,-50%) rotate(150deg)}.c{transform:translate(0,-50%) rotate(270deg)}.hub{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:73px;height:73px;border-radius:50%;display:grid;place-items:center;background:radial-gradient(circle at 40% 35%,#293239,#0c1014 72%);font-weight:950}
.hint{position:absolute;z-index:700;left:16px;bottom:16px;padding:9px 11px;border-radius:12px;display:flex;gap:12px;flex-wrap:wrap;font-size:11px;color:#c6cfd8}.hint kbd{display:inline-grid;place-items:center;min-width:21px;height:21px;padding:0 6px;margin-right:3px;border-radius:6px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.18);font:700 11px ui-monospace,monospace}.center-msg{position:absolute;z-index:690;left:50%;top:16px;transform:translateX(-50%);padding:8px 12px;border-radius:12px;font-size:11px;color:#d8e0e8;pointer-events:none}.toast{position:absolute;z-index:1000;left:50%;top:16px;transform:translateX(-50%);padding:10px 14px;border-radius:12px;background:rgba(7,11,16,.95);border:1px solid var(--line);opacity:0;pointer-events:none;transition:.18s}.toast.show{opacity:1;transform:translate(-50%,5px)}
.car{position:relative;width:76px;height:42px;transform-origin:50% 50%;filter:drop-shadow(0 7px 6px rgba(0,0,0,.52))}.car.bus{width:102px;height:46px}.car-body{position:absolute;inset:5px 7px;border-radius:12px 19px 19px 12px;background:linear-gradient(#fff,#d8e0e6);border:1px solid rgba(0,0,0,.43);box-shadow:inset 0 -5px 9px rgba(0,0,0,.08)}.bus .car-body{inset:4px 5px;border-radius:7px 14px 14px 7px}.windshield{position:absolute;left:31px;top:9px;width:23px;height:23px;border-radius:5px;background:linear-gradient(#29343e,#0b1014)}.bus .windshield{left:39px;top:8px;width:40px;height:25px}.nose{position:absolute;right:7px;top:13px;width:9px;height:15px;border-radius:0 8px 8px 0;background:#f7fafc}.tire{position:absolute;width:9px;height:8px;border-radius:50%;background:#050708;border:1px solid #384149}.t1{left:17px;top:2px}.t2{left:17px;bottom:2px}.t3{right:17px;top:2px}.t4{right:17px;bottom:2px}.lamp{position:absolute;right:4px;width:4px;height:5px;border-radius:2px;background:#fff2a9;box-shadow:0 0 8px #ffef96}.l1{top:9px}.l2{bottom:9px}
.mobile{display:none}.leaflet-container{font:inherit}.leaflet-control-attribution{font-size:10px!important;background:rgba(255,255,255,.82)!important;color:#222!important}.leaflet-control-attribution a{color:#234!important}
@media(max-width:820px){#app{grid-template-rows:58px minmax(0,1fr)}header{height:58px;padding:0 10px;gap:9px}.title,.tag{display:none}.search{width:min(56vw,360px)}.mode{top:10px;left:10px}.vehicle{top:68px;left:10px;width:106px}.status,.hint,.center-msg{display:none}.follow{top:10px;right:10px}.wheelwrap{display:none}.speed{bottom:98px;min-width:170px}.speednum{font-size:38px}.mobile{display:flex;position:absolute;z-index:800;left:10px;right:10px;bottom:max(10px,env(safe-area-inset-bottom));justify-content:space-between;pointer-events:none}.mobile>div{display:flex;gap:8px;pointer-events:auto}.touch{min-width:66px;height:68px;border-radius:18px;background:rgba(7,11,16,.86);border:1px solid rgba(255,255,255,.16);font-weight:900;touch-action:none;user-select:none}.gas{color:var(--green)}.brake{color:#ff9b9b}}
</style>
</head>
<body>
<div id="app">
<header>
  <h1>Lee Family Press</h1>
  <nav>
    <a href="https://leefamilypress.com/index.html">Home</a>
    <a href="https://leefamilypress.com/works.html">Works</a>
    <a href="https://leefamilypress.com/contact.html">Contact</a>
    <div class="dropdown">
      <a href="#">Authors ▾</a>
      <div class="dropdown-content">
        <a href="https://leefamilypress.com/authors/jun-hee-lee.html">Jun Hee Lee</a>
        <a href="https://leefamilypress.com/authors/jaewon-lee.html">Jaewon Lee</a>
      </div>
    </div>
  </nav>
</header>

<style>
.dropdown {
  position: relative;
  display: inline-block;
}
.dropdown-content {
  display: none;
  position: absolute;
  top: 100%;
  right: 0;
  left: auto;
  background: #222;
  padding: 0.5rem 0;
  border-radius: 6px;
  box-shadow: 0 4px 8px rgba(0,0,0,0.3);
  min-width: 180px;
  z-index: 1000;
}
.dropdown-content a {
  display: block;
  padding: 0.5rem 1rem;
  color: #ddd;
  text-decoration: none;
  transition: background 0.3s, color 0.3s;
}
.dropdown-content a:hover {
  background: #333;
  color: #ff6600;
}
.dropdown:hover .dropdown-content {
  display: block;
}
</style>
<main id="game">
  <div id="map"></div>
  <div class="mode glass"><button data-mode="street">Map</button><button data-mode="satellite" class="active">Satellite</button><button data-mode="hybrid">Hybrid</button></div>
  <div class="vehicle glass"><div class="small-title">Vehicle</div><button class="active" data-vehicle="car">Car</button><button data-vehicle="bus">Bus</button></div>
  <div class="status glass"><div class="row"><span>GEAR</span><strong id="gear">N</strong></div><div class="row"><span>HEADING</span><strong id="heading">090°</strong></div><div class="row"><span>POSITION</span><strong id="coords">—</strong></div></div>
  <div class="follow glass"><button id="followBtn">Follow Car: OFF</button></div>
  <div class="center-msg glass">Pure 2D aerial view — north is always up</div>
  <div class="speed glass"><div class="speednum" id="kmh">0</div><div class="speedmeta"><span>km/h</span><strong id="mph">0 mph</strong></div><div class="bar"><i id="speedBar"></i></div></div>
  <div class="wheelwrap"><div class="wheel" id="wheel"><div class="rim"></div><div class="spoke a"></div><div class="spoke b"></div><div class="spoke c"></div><div class="hub">D</div></div></div>
  <div class="hint glass"><span><kbd>W</kbd>/<kbd>↑</kbd> forward</span><span><kbd>S</kbd>/<kbd>↓</kbd> brake / reverse</span><span><kbd>A</kbd>/<kbd>D</kbd> steer</span><span><kbd>Space</kbd> handbrake</span><span><kbd>R</kbd> reset</span></div>
  <div class="mobile"><div><button class="touch" data-key="ArrowLeft">◀</button><button class="touch" data-key="ArrowRight">▶</button></div><div><button class="touch brake" data-key="ArrowDown">BRAKE</button><button class="touch gas" data-key="ArrowUp">GAS</button></div></div>
</main>
</div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
<script>
const CFG={start:{lat:42.2808,lng:-83.7430},zoom:19,maxForwardKmh:100,maxReverseKmh:28,accel:5.8,reverseAccel:3.4,brake:10.5,rolling:1.0,drag:.012,turnRate:100};
const state={pos:{...CFG.start},spawn:{...CFG.start},heading:90,speed:0,steer:0,vehicle:'car',follow:false};
const keys=new Set();let map,marker,baseLayer,labelLayer,last=0,toastTimer,lastIconHeading=-999,lastIconVehicle='';
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const tiles={street:L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'&copy; OpenStreetMap contributors'}),satellite:L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',{maxZoom:20,attribution:'Tiles &copy; Esri'}),labels:L.tileLayer('https://services.arcgisonline.com/ArcGIS/rest/services/Reference/World_Boundaries_and_Places/MapServer/tile/{z}/{y}/{x}',{maxZoom:20,attribution:'Labels &copy; Esri'})};
function vehicleIcon(){const bus=state.vehicle==='bus';return L.divIcon({className:'',iconSize:bus?[102,46]:[76,42],iconAnchor:bus?[51,23]:[38,21],html:`<div class="car${bus?' bus':''}" style="transform:rotate(${state.heading}deg)"><div class="car-body"></div><div class="windshield"></div><div class="nose"></div><div class="tire t1"></div><div class="tire t2"></div><div class="tire t3"></div><div class="tire t4"></div><div class="lamp l1"></div><div class="lamp l2"></div></div>`});}
function refreshIcon(force=false){const h=Math.round(state.heading*2)/2;if(force||h!==lastIconHeading||state.vehicle!==lastIconVehicle){marker.setIcon(vehicleIcon());lastIconHeading=h;lastIconVehicle=state.vehicle;}}
function init(){map=L.map('map',{center:[state.pos.lat,state.pos.lng],zoom:CFG.zoom,zoomControl:false,keyboard:false,dragging:true,scrollWheelZoom:true,doubleClickZoom:true,touchZoom:true,attributionControl:true});baseLayer=tiles.satellite.addTo(map);marker=L.marker([state.pos.lat,state.pos.lng],{icon:vehicleIcon(),interactive:false,zIndexOffset:1000}).addTo(map);bind();updateHud();requestAnimationFrame(loop);toast('Click the map, then use W to drive forward.');}
function bind(){window.addEventListener('keydown',e=>{if(document.activeElement?.tagName==='INPUT')return;const k=norm(e.key);if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Space'].includes(k))e.preventDefault();keys.add(k);if(k==='r')reset();},{passive:false});window.addEventListener('keyup',e=>keys.delete(norm(e.key)));window.addEventListener('blur',()=>keys.clear());$('#game').addEventListener('pointerdown',()=>{if(document.activeElement?.tagName!=='INPUT')window.focus();});
$$('[data-mode]').forEach(b=>b.onclick=()=>setMode(b.dataset.mode,b));$$('[data-vehicle]').forEach(b=>b.onclick=()=>{state.vehicle=b.dataset.vehicle;$$('[data-vehicle]').forEach(x=>x.classList.toggle('active',x===b));refreshIcon(true);});$('#followBtn').onclick=()=>{state.follow=!state.follow;$('#followBtn').classList.toggle('active',state.follow);$('#followBtn').textContent='Follow Car: '+(state.follow?'ON':'OFF');if(state.follow)map.panTo([state.pos.lat,state.pos.lng],{animate:true,duration:.25});};$('#resetBtn').onclick=reset;
$('#searchForm').onsubmit=async e=>{e.preventDefault();const q=$('#searchInput').value.trim();if(!q)return;toast('Searching…');try{const r=await fetch('https://nominatim.openstreetmap.org/search?format=json&limit=1&q='+encodeURIComponent(q),{headers:{Accept:'application/json'}});const a=await r.json();if(!a.length){toast('Location not found.');return;}state.pos={lat:+a[0].lat,lng:+a[0].lon};state.spawn={...state.pos};state.speed=0;map.setView([state.pos.lat,state.pos.lng],CFG.zoom,{animate:false});marker.setLatLng([state.pos.lat,state.pos.lng]);toast('Moved to '+a[0].display_name);}catch(err){console.error(err);toast('Search unavailable right now.');}};
$$('.touch').forEach(b=>{const k=b.dataset.key;const down=e=>{e.preventDefault();keys.add(k);b.setPointerCapture?.(e.pointerId)},up=e=>{e.preventDefault();keys.delete(k)};b.addEventListener('pointerdown',down);b.addEventListener('pointerup',up);b.addEventListener('pointercancel',up);b.addEventListener('lostpointercapture',up);});}
function setMode(mode,b){if(baseLayer)map.removeLayer(baseLayer);if(labelLayer){map.removeLayer(labelLayer);labelLayer=null;}if(mode==='street')baseLayer=tiles.street.addTo(map);else{baseLayer=tiles.satellite.addTo(map);if(mode==='hybrid')labelLayer=tiles.labels.addTo(map);}$$('[data-mode]').forEach(x=>x.classList.toggle('active',x===b));}
function loop(t){if(!last)last=t;const dt=Math.min((t-last)/1000,.05);last=t;physics(dt);render();requestAnimationFrame(loop);}
function physics(dt){const gas=down('w','ArrowUp'),brake=down('s','ArrowDown'),left=down('a','ArrowLeft'),right=down('d','ArrowRight'),handbrake=down('Space');const maxF=CFG.maxForwardKmh/3.6,maxR=CFG.maxReverseKmh/3.6;if(gas){if(state.speed<-.3)state.speed+=CFG.brake*dt;else state.speed+=CFG.accel*dt;}if(brake){if(state.speed>.3)state.speed-=CFG.brake*dt;else state.speed-=CFG.reverseAccel*dt;}if(!gas&&!brake){const r=CFG.rolling*dt;state.speed=Math.abs(state.speed)<=r?0:state.speed-Math.sign(state.speed)*r;}state.speed-=state.speed*Math.abs(state.speed)*CFG.drag*dt;if(handbrake)state.speed*=Math.max(0,1-8*dt);state.speed=clamp(state.speed,-maxR,maxF);const target=(right?1:0)-(left?1:0),snap=target?7:3;state.steer+=(target-state.steer)*Math.min(1,snap*dt);const v=Math.abs(state.speed);if(v>.02){const steerFactor=clamp(v/4,0,1)/(1+v/23);state.heading=(state.heading+state.steer*CFG.turnRate*steerFactor*(state.speed>=0?1:-1)*dt+360)%360;state.pos=destination(state.pos.lat,state.pos.lng,state.heading,state.speed*dt);}}
function render(){marker.setLatLng([state.pos.lat,state.pos.lng]);refreshIcon();if(state.follow){map.panTo([state.pos.lat,state.pos.lng],{animate:false,noMoveStart:true});}else keepVisible();updateHud();}
function keepVisible(){const p=map.latLngToContainerPoint([state.pos.lat,state.pos.lng]),size=map.getSize(),margin=90;if(p.x<margin||p.x>size.x-margin||p.y<margin||p.y>size.y-margin){map.panTo([state.pos.lat,state.pos.lng],{animate:true,duration:.2});}}
function updateHud(){const kmh=Math.abs(state.speed)*3.6,mph=kmh*.621371;$('#kmh').textContent=Math.round(kmh);$('#mph').textContent=Math.round(mph)+' mph';$('#speedBar').style.width=clamp(kmh/CFG.maxForwardKmh*100,0,100)+'%';$('#gear').textContent=Math.abs(state.speed)<.15?'N':state.speed>0?'D':'R';$('#heading').textContent=String(Math.round(state.heading)%360).padStart(3,'0')+'°';$('#coords').textContent=state.pos.lat.toFixed(5)+', '+state.pos.lng.toFixed(5);$('#wheel').style.transform=`rotate(${state.steer*115}deg)`;}
function reset(){state.pos={...state.spawn};state.speed=0;state.steer=0;map.setView([state.pos.lat,state.pos.lng],CFG.zoom,{animate:false});marker.setLatLng([state.pos.lat,state.pos.lng]);refreshIcon(true);toast('Vehicle reset.');}
function destination(lat,lng,bearing,meters){const R=6371000,b=bearing*Math.PI/180,p1=lat*Math.PI/180,l1=lng*Math.PI/180,a=meters/R,p2=Math.asin(Math.sin(p1)*Math.cos(a)+Math.cos(p1)*Math.sin(a)*Math.cos(b)),l2=l1+Math.atan2(Math.sin(b)*Math.sin(a)*Math.cos(p1),Math.cos(a)-Math.sin(p1)*Math.sin(p2));return{lat:p2*180/Math.PI,lng:((l2*180/Math.PI+540)%360)-180};}
function down(...names){return names.some(n=>keys.has(n))}function norm(k){if(k===' ')return'Space';return k.length===1?k.toLowerCase():k}function clamp(v,min,max){return Math.max(min,Math.min(max,v))}function toast(msg){let t=$('.toast');if(!t){t=document.createElement('div');t.className='toast';$('#game').appendChild(t);}t.textContent=msg;t.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.classList.remove('show'),2200);}
init();
</script>
</body>
</html>
